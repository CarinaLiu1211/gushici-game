.qright{min-width:0}
.qright .type{font-size:12px;color:#697386;margin-bottom:8px}
.qright .mask{margin:4px 0 14px}

const KEY="ielts-spelling-game-v5";
// 修复学习计划中因 Excel 单元格换行/括号拆分造成的“英文有了、中文为空”问题。
// 计划中的中文优先从词库按英文查找；若计划文本本身被拆成多段，则把括号里的释义重新合并。
function cleanPlanWords(){
 DATA.plans.forEach(p=>{
   const out=[];
   for(let i=0;i<p.words.length;i++){
     const raw=String(p.words[i]?.word||"").trim();
     if(!raw) continue;
     // 普通完整词：直接按词库中的完整中文释义匹配。
     if(!raw.includes("（") && !raw.includes("(")){
       const v=DATA.vocab.find(x=>norm(x.word)===norm(raw));
       if(v) out.push(v);
       else if(p.words[i].cn) out.push({...p.words[i]});
       continue;
     }
     // “exact（精确的” + “强求）” 这类被拆开的计划项。
     let word=raw, meaning=String(p.words[i].cn||"");
     let j=i;
     while(!/[）)]/.test(word) && j+1<p.words.length){
       j++;
       word+=String(p.words[j]?.word||"");
     }
     const left=word.indexOf("（")>=0?word.indexOf("（"):word.indexOf("(");
     const close=word.lastIndexOf("）")>=0?word.lastIndexOf("）"):word.lastIndexOf(")");
     let base=left>=0?word.slice(0,left):word;
     let inner=(left>=0&&close>left)?word.slice(left+1,close):meaning;
     base=base.trim();
     const v=DATA.vocab.find(x=>norm(x.word)===norm(base));
     if(v) out.push(v);
     else if(base) out.push({word:base,cn:inner,pos:"",page:p.pages});
     i=j;
   }
   p.words=out;
 });
}

function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function norm(s){return String(s||"").trim().toLowerCase().replace(/[’']/g,"'")}
function allVocab(){return [...DATA.vocab,...state.customVocab]}
function findWord(w){return allVocab().find(x=>norm(x.word)===norm(w))}
function meaningOf(v){
 const keys=["cn","meaning","chinese","translation","definition","definitions","释义","中文","中文释义","意思"];
 for(const k of keys){
   const x=v?.[k];
   if(Array.isArray(x)&&x.length)return x.join("；");
   if(typeof x==="string"&&x.trim())return x.trim();
 }
 return "（暂无中文释义）";
}
function localISO(){const d=new Date(),z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function parseDate(s){return new Date(s+"T00:00:00")}
function dateKey(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return dateKey(d)}
function getPlanDate(actual){
 if(isPaused(actual)) return null;
 let d=actual;
 // Every paused calendar day pushes the original study schedule forward by one day.
 // Recalculate until stable so consecutive pause dates are handled correctly.
 for(let guard=0;guard<100;guard++){
   const before=d;
   const skipped=state.paused.filter(x=>x<=actual && x<=d).length;
   d=addDays(actual,-skipped);
   if(d===before)break;
 }
 return d;
}
function isWeekend(s){const n=parseDate(s).getDay();return n===0||n===6}
function isPaused(s){return state.paused.includes(s)}
function planForDate(s){const original=getPlanDate(s);return original?DATA.plans.find(p=>p.date===original):null}
function learningIndex(date){let n=0;for(const p of DATA.plans){if(p.date>date)break;if(p.type.includes("新词"))n++}return n}
function getTaskCount(date){
 const p=planForDate(date),idx=learningIndex(date);
 if(p&&p.type.includes("新词")){if(idx===1)return 3;if(idx===2)return 6;if(idx===3)return 9;if(idx===4)return 12;if(idx>=5&&idx<=9)return 10;if(idx>=10)return 15}
 if(isWeekend(date)){let learned=new Set();for(const pp of DATA.plans){if(pp.date>=date)break;if(pp.type.includes("新词"))for(const x of pp.words)learned.add(norm(x.word))}return Math.max(1,Math.min(10,Math.ceil(learned.size/5)))}
 return 1
}
function maskWord(word){const c=[...word],h=new Set(),v="aeiou";for(let i=0;i<c.length;i++)if(v.includes(c[i].toLowerCase()))h.add(i);const combos=["tion","sion","ment","ness","able","ible","ough","ch","sh","th","ph","wh","ck","qu","ee","ea","oo","ou","ow","ai","ay","oi","oy","au","aw","er","or","ar","ir","ur"];for(const x of combos){const k=word.toLowerCase().indexOf(x);if(k>=0){for(let i=k;i<Math.min(c.length,k+x.length);i++)h.add(i);break}}let a=[...h].sort(()=>Math.random()-.5).slice(0,Math.max(1,Math.round(c.length*.3)));if(!a.length)a=[Math.floor(c.length/2)];return c.map((x,i)=>a.includes(i)?"_":x).join("")}

function chooseQuestions(date){
 const p=planForDate(date),total=getTaskCount(date);
 const newWords=(p&&p.type.includes("新词")?p.words:[]).map(x=>findWord(x.word)||x).filter(Boolean).sort(()=>Math.random()-.5);
 const learned=[];for(const pp of DATA.plans){if(pp.date>=date)break;if(pp.type.includes("新词"))for(const x of pp.words){const v=findWord(x.word)||x;if(v)learned.push(v)}}
 if(learningIndex(date)===1&&p&&p.type.includes("新词"))return newWords.slice(0,15).map(v=>({v,type:Math.random()<.5?"mask":"full"}));
 const mistakes=allVocab().filter(v=>state.mistakes[norm(v.word)]?.wrong>0).sort((a,b)=>(state.mistakes[norm(b.word)].wrong||0)-(state.mistakes[norm(a.word)].wrong||0));
 const newKeys=new Set(newWords.map(v=>norm(v.word))),pool=[],seen=new Set();
 [...mistakes,...learned].forEach(v=>{const k=norm(v.word);if(k&&!newKeys.has(k)&&!seen.has(k)){seen.add(k);pool.push(v)}});
 const chosen=[],used=new Set();
 function typ(v){const s=state.formSeen[norm(v.word)]||{mask:false,full:false};return !s.mask?"mask":(!s.full?"full":(Math.random()<.5?"mask":"full"))}
 function add(v){const k=norm(v.word);if(chosen.length<total*5&&!used.has(k)){used.add(k);chosen.push({v,type:typ(v)})}}
 newWords.forEach(add);pool.sort(()=>Math.random()-.5).forEach(add);
 const fallback=isWeekend(date)?pool:[...pool,...newWords];let guard=0;
 while(chosen.length<total*5&&fallback.length&&guard<total*30){guard++;const v=fallback[Math.floor(Math.random()*fallback.length)];chosen.push({v,type:typ(v)})}
 const groups=[];for(let i=0;i<chosen.length;i+=5){const g=chosen.slice(i,i+5);if(g.length===5){const m=g.filter(q=>q.type==="mask").length;if(m===0)g[Math.floor(Math.random()*5)].type="mask";if(m===5)g[Math.floor(Math.random()*5)].type="full"}g.sort(()=>Math.random()-.5);groups.push(g)}groups.sort(()=>Math.random()-.5);return groups.flat()
}

let game=null;
function startGame(date){const qs=chooseQuestions(date),groups=[];for(let i=0;i<qs.length;i+=5)groups.push(qs.slice(i,i+5));game={date,groups,index:0,score:0};renderGame()}

 g.forEach((q,i)=>{

           const done=q.blanks.every((_,k)=>norm(document.getElementById("blank_"+i+"_"+k)?.value));

         };

     })
   }else{
     const x=document.getElementById("ans_"+i);
     if(x){
       x.oninput=()=>{
         // 完整拼写输入达到单词长度后自动检查；Enter 也可立即检查。

}
function makeMaskInputs(word,i){
 const chars=[...word], hidden=new Set(),v="aeiou";
 for(let k=0;k<chars.length;k++)if(v.includes(chars[k].toLowerCase()))hidden.add(k);
 const combos=["tion","sion","ment","ness","able","ible","ough","ch","sh","th","ph","wh","ck","qu","ee","ea","oo","ou","ow","ai","ay","oi","oy","au","aw","er","or","ar","ir","ur"];
 for(const x of combos){
   const k=word.toLowerCase().indexOf(x);
   if(k>=0){for(let z=k;z<Math.min(chars.length,k+x.length);z++)hidden.add(z);break}
 }
 let h=[...hidden].sort(()=>Math.random()-.5).slice(0,Math.max(1,Math.round(chars.length*.3)));
 if(!h.length)h=[Math.floor(chars.length/2)];
 h.sort((a,b)=>a-b);
 const set=new Set(h), blanks=[];
 let html="";
 for(let k=0;k<chars.length;k++){
   if(set.has(k)){
     const j=blanks.length;blanks.push(k);
     html+='<input class="letterBlank" id="blank_'+i+'_'+j+'" maxlength="1" inputmode="text" aria-label="第 '+(i+1)+' 题第 '+(j+1)+' 个空">';
   }else html+='<span class="shownLetter">'+chars[k]+'</span>';
 }
 return {html,blanks}
}

function checkAnswer(i){
 const q=game.groups[game.index][i];if(!q||q.checked)return;
 let answer="";
 if(q.type==="mask"){
   answer=q.blanks.map((_,j)=>norm(document.getElementById("blank_"+i+"_"+j)?.value)).join("");
   // Compare the entered letters with the actual hidden positions.
   const expected=q.blanks.map(pos=>norm(q.v.word[pos])).join("");
   if(answer.length<q.blanks.length)return;
   q.userAnswer=answer;q.expected=expected;
 }else{
   const input=document.getElementById("ans_"+i);if(!input||!norm(input.value))return;
   answer=norm(input.value)
 }
 const ok=q.type==="mask"?answer===q.expected:answer===norm(q.v.word);
 q.checked=true;
 const key=norm(q.v.word),rec=state.mistakes[key]||{wrong:0,correct:0,lastWrong:"",lastCorrect:""};
 const fs=state.formSeen[key]||{mask:false,full:false};fs[q.type]=true;state.formSeen[key]=fs;
 if(ok){game.score++;rec.correct++;rec.lastCorrect=game.date}else{rec.wrong++;rec.lastWrong=game.date}
 state.mistakes[key]=rec;save();
 if(q.type==="mask"){
   q.blanks.forEach((_,j)=>{const x=document.getElementById("blank_"+i+"_"+j);if(x)x.disabled=true})
 }else document.getElementById("ans_"+i).disabled=true;
 const fb=document.getElementById("fb_"+i);
 fb.className="feedback "+(ok?"ok":"bad");
 fb.textContent=ok?"✅ 正确！":"❌ 正确答案："+q.v.word;
 if(game.groups[game.index].every(x=>x.checked))setTimeout(()=>{game.index++;renderGame()},350)
}

function parseBulkText(text,name){
 const lines=String(text||"").replace(/^\uFEFF/,"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const out=[];
 const seen=new Set();
 for(let line of lines){
   // Ignore obvious header rows.
   if(/^(english|word|单词|英文)\s*[,|\t;]\s*(chinese|meaning|definition|中文|释义)/i.test(line))continue;
   let parts;
   if(line.includes("|")) parts=line.split("|");
   else if(line.includes("\t")) parts=line.split("\t");
   else if(line.includes(",")) parts=line.split(",");
   else if(line.includes(";")) parts=line.split(";");
   else parts=line.split(/\s{2,}/);
   let w=(parts[0]||"").trim();
   let cn=(parts.slice(1).join(" | ")||"").trim();
   let page="";
   // Optional third column can be page number.
   if(parts.length>=3 && /^\s*(page|页码)?\s*\d+/i.test(parts[2]))page=(parts[2].match(/\d+/)||[""])[0];
   if(!w||!cn)continue;
   // Remove surrounding quotes from CSV-style fields.
   w=w.replace(/^["']|["']$/g,"").trim();cn=cn.replace(/^["']|["']$/g,"").trim();
   const k=norm(w);if(!k||seen.has(k))continue;seen.add(k);
   out.push({word:w,cn,pos:"",page:page||"自定义"});
 }
 return out;
}
async function importVocabFile(file){
 const name=file.name.toLowerCase();
 if(name.endsWith(".xlsx")||name.endsWith(".xls")){
   alert("目前这个离线网页版支持 TXT / CSV / TSV / JSON 批量导入。Excel（XLSX）请先另存为 CSV（UTF-8），再导入即可。这样不依赖网络，打开网页也能正常使用。");
   return;
 }
 const text=await file.text();
 let incoming=[];
 if(name.endsWith(".json")){
   try{
     const obj=JSON.parse(text),arr=Array.isArray(obj)?obj:(obj.vocab||obj.words||obj.data||[]);
     incoming=arr.map(x=>({word:String(x.word||x.english||x.en||"").trim(),cn:String(x.cn||x.chinese||x.meaning||x.translation||x.definition||"").trim(),pos:x.pos||"",page:x.page||"自定义"})).filter(x=>x.word&&x.cn);
   }catch(e){alert("JSON 文件读取失败，请检查格式。");return}
 }else incoming=parseBulkText(text,name);
 let added=0,dup=0,bad=0;
 for(const v of incoming){
   if(!v.word||!v.cn){bad++;continue}
   if(findWord(v.word)){dup++;continue}
   state.customVocab.push(v);added++;
 }
 save();renderVocab();renderToday();
 const r=document.getElementById("importResult");
 if(r)r.innerHTML='<b>导入完成：</b>新增 '+added+' 个；重复跳过 '+dup+' 个'+(bad?'；无效 '+bad+' 个':'')+'。';
}

function renderPause(){
 const el=document.getElementById("pause");
 const dates=[...state.paused].sort();
 // Group consecutive paused dates into ranges for a cleaner display.
 const ranges=[];
 dates.forEach(d=>{
   const last=ranges[ranges.length-1];
   if(!last || addDays(last.end,1)!==d) ranges.push({start:d,end:d});
   else last.end=d;
 });
 el.innerHTML='<div class="card"><h2>暂停计划设置</h2>'+
 '<p class="muted">可以一次暂停连续几天。暂停期间不出题；暂停结束后，后面的学习计划会自动顺延相同天数，不需要补做。</p>'+
 '<div class="qrow" style="align-items:end">'+
 '<div><div class="small">起始日期</div><input id="pauseStart" type="date"></div>'+
 '<div><div class="small">结束日期</div><input id="pauseEnd" type="date"></div>'+
 '</div>'+
 '<div class="actions"><button class="btn primary" id="pauseBtn">暂停这段日期</button><button class="btn" id="clearRangeBtn">取消这段日期</button></div>'+
 '<div class="notice">例如：起始日期 2026-09-01，结束日期 2026-09-05 → 连续暂停5天；9月6日之后的学习计划自动顺延5天。</div>'+
 '<div class="scroll"><table><thead><tr><th>暂停日期</th><th>操作</th></tr></thead><tbody>'+
 (ranges.length?ranges.map(r=>'<tr><td>'+r.start+(r.start===r.end?'':' ～ '+r.end)+'</td><td><button class="btn unpauseRange" data-start="'+r.start+'" data-end="'+r.end+'">取消这段暂停</button></td></tr>').join(""):'<tr><td colspan="2" class="muted">目前没有暂停日期</td></tr>')+
 '</tbody></table></div></div>';

 function getRange(){
   const s=document.getElementById("pauseStart").value,e=document.getElementById("pauseEnd").value;
   if(!s||!e||s>e){alert("请选择正确的起始日期和结束日期。");return null}
   return {start:s,end:e}
 }
 document.getElementById("pauseBtn").onclick=()=>{
   const r=getRange();if(!r)return;
   let d=r.start;
   while(d<=r.end){if(!state.paused.includes(d))state.paused.push(d);d=addDays(d,1)}
   state.paused.sort();save();renderPause();renderToday();
 };
 document.getElementById("clearRangeBtn").onclick=()=>{
   const r=getRange();if(!r)return;
   state.paused=state.paused.filter(d=>d<r.start||d>r.end);
   save();renderPause();renderToday();
 };
 document.querySelectorAll(".unpauseRange").forEach(b=>b.onclick=()=>{
   state.paused=state.paused.filter(d=>d<b.dataset.start||d>b.dataset.end);
   save();renderPause();renderToday();
 });
}
